services:
  app:
    build: .
    container_name: sokora
    restart: always
    volumes:
      - ./data.db:/app/data.db
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      db-postgres:
        condition: service_healthy
        required: false
      db-mysql:
        condition: service_healthy
        required: false

  db-postgres:
    image: postgres:17
    profiles: [postgres]
    environment:
      POSTGRES_USER: sokora
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: sokora-db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokora -d sokora-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-mysql:
    image: mysql:9
    profiles: [mysql]
    environment:
      MYSQL_USER: sokora
      MYSQL_PASSWORD: 1234
      MYSQL_DATABASE: sokora-db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sokora", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 5
